# .gitlab-ci.yml
stages:
  - build

variables:
  fnversion: "${CI_COMMIT_TAG}"   # 全局

.build_template: &build_definition
  stage: build
  image: 192.168.0.226/feishuwg/ubuntu:webhook
  before_script:
    - echo "fnversion=[${fnversion}]"      # 调试用
  script:
    - bash build.sh "$ARCH"
    - curl -F "filename=@feishunet-${ARCH}.fpk" "http://192.168.3.104:8888/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/" #上传
  artifacts:
    name: "feishunet-${ARCH}-${fnversion}"
    paths:
      - feishunet-${ARCH}.fpk
    expire_in: 30 days
  # 关键：只在 tag 时跑，普通 push 不触发
  only:
    - tags
  tags:
    - test

build:x86:
  variables:
    ARCH: x86
  <<: *build_definition

build:arm:
  variables:
    ARCH: arm
  <<: *build_definition